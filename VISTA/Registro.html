<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ADSO</title>
    <link rel="stylesheet" href="../ACCES/css/Style.css">
</head>
<body>
    <div class="contenedor">
        <h2>Registro de Asociado - Acerías</h2>
        <form id="formRegistro" action="" method="post">

            <div class="grupo-input">
                <label>Documento</label>
                <input type="text" id="documento" inputmode="numeric" pattern="[0-9]+"
                       required placeholder="Ejemplo: 1057000111">
            </div>

            <div class="grupo-input">
                <label>Nombres</label>
                <input type="text" id="nombre" required placeholder="Ingrese sus nombres completos">
            </div>

            <div class="grupo-input">
                <label>Apellidos</label>
                <input type="text" id="apellido" required placeholder="Ingrese sus apellidos completos">
            </div>

            <div class="grupo-input">
                <label>Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" required>
            </div>

            <div class="grupo-input">
                <label>Género</label>
                <div class="grupo-radios">
                    <label class="radio">
                        <input type="radio" name="genero" id="generoM" value="Masculino" required>
                        <span>Masculino</span>
                        
                    </label>
                    <label class="radio">
                        <input type="radio" name="genero" id="generoF" value="Femenino">
                        <span>Femenino</span>
                        
                    </label>
                    <label class="radio">
                        <input type="radio" name="genero" id="generoO" value="Otros">
                        </span>Otros</span>
                        
                    </label>
                </div>
            </div>

            <div class="grupo-input">
                <label>Dirección de residencia</label>
                <input type="text" id="direccionResidencia" required placeholder="Ingrese su dirección">
            </div>

            <div class="grupo-input">
                <label>Ciudad</label>
                <select id="ciudad" required>
                    <option value="" disabled selected>Seleccione una ciudad</option>
                    <option value="sogamoso">Sogamoso</option>
                    <option value="duitama">Duitama</option>
                    <option value="tunja">Tunja</option>
                </select>
            </div>

            <div class="grupo-input">
                <label>Teléfono</label>
                <input type="tel" id="telefono" required placeholder="Ingrese su teléfono">
            </div>

            <div class="grupo-input">
                <label>Email</label>
                <input type="email" id="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="grupo-botones">
                <button type="submit" class="btn-guardar">Guardar</button>
                <button type="reset" class="btn-limpiar">Limpiar</button>
            </div>

        </form>
    </div>
</body>
</html>

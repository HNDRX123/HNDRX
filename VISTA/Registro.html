<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ADSO</title>
    <link rel="stylesheet" href="../ACCES/css/Style.css">
</head>
<body>
    <div class="contenedor">
        <h2>Registro de Asociado - Acerías</h2>
        <form id="formRegistro" action="../MODELO/guardarAsociado.php" method="post">

            <div class="grupo-input">
                <label for="documento">Documento</label>
                <input type="text" id="documento" name="documento" inputmode="numeric" pattern="[0-9]+"
                       required placeholder="Ejemplo: 1057000111">
            </div>

            <div class="grupo-input">
                <label for="nombres">Nombres</label>
                <input type="text" id="nombres" name="nombres" required placeholder="Ingrese sus nombres completos">
            </div>

            <div class="grupo-input">
                <label for="apellidos">Apellidos</label>
                <input type="text" id="apellidos" name="apellidos" required placeholder="Ingrese sus apellidos completos">
            </div>

            <div class="grupo-input">
                <label for="fechaNacimiento">Fecha de nacimiento</label>
                <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
            </div>

            <div class="grupo-input">
                <label>Género</label>
                <div class="grupo-radios">
                    <label class="radio">
                        <input type="radio" name="genero" id="generoM" value="Masculino" required>
                        <span>Masculino</span>
                    </label>
                    <label class="radio">
                        <input type="radio" name="genero" id="generoF" value="Femenino">
                        <span>Femenino</span>
                    </label>
                    <label class="radio">
                        <input type="radio" name="genero" id="generoO" value="Otro">
                        <span>Otro</span>
                    </label>
                </div>
            </div>

            <div class="grupo-input">
                <label for="direccionResidencia">Dirección de residencia</label>
                <input type="text" id="direccionResidencia" name="direccionResidencia" required placeholder="Ingrese su dirección">
            </div>

            <div class="grupo-input">
                <label for="ciudad">Ciudad</label>
                <select id="ciudad" name="ciudad" required>
                    <option value="" disabled selected>Seleccione una ciudad</option>
                    <option value="Sogamoso">Sogamoso</option>
                    <option value="Duitama">Duitama</option>
                    <option value="Tunja">Tunja</option>
                </select>
            </div>

            <div class="grupo-input">
                <label for="telefono">Teléfono</label>
                <input type="tel" id="telefono" name="telefono" required placeholder="Ingrese su teléfono">
            </div>

            <div class="grupo-input">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
            </div>

            <div class="grupo-input">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required minlength="8" placeholder="Ingrese su contraseña (mínimo 8 caracteres)">
            </div>

            <div class="grupo-input">
                <label for="confirmarPassword">Confirmar contraseña</label>
                <input type="password" id="confirmarPassword" name="confirmarPassword" required minlength="8" placeholder="Repita su contraseña">
            </div>

            <div class="grupo-botones">
                <button type="submit" class="btn-guardar">Guardar</button>
                <button type="reset" class="btn-limpiar">Limpiar</button>
            </div>
            
            <p id="mensajeRegistro" role="status" aria-live="polite" style="margin-top: 15px; text-align: center; font-weight: bold;"></p>

        </form>
    </div>

    <script src="../CONTROLADORES/asociado.js"></script>
</body>
</html>

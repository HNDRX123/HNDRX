<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLUB ACERÍAS - Registro de Asociado</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-mr: #1177a0;
            --primary-dark-mr: #0b2286;
            --primary-hover-mr: #0e5e7e;
        }
        .header-mr {
            background-color: var(--primary-mr);
            color: #fff;
            padding: 1rem 1.5rem;
            border-bottom: 4px solid var(--primary-dark-mr);
        }
        .registro-card {
            border-top: 4px solid var(--primary-mr);
            transition: box-shadow .15s;
        }
        .registro-card:hover {
            box-shadow: 0 .5rem 1rem rgba(0, 0, 0, .15) !important;
        }
        .icono-registro {
            font-size: 3rem;
            color: var(--primary-mr);
        }
        .header-mr .btn-outline-light {
            color: #ffffff !important;
            border-color: #ffffff !important;
        }
        .header-mr .btn-outline-light:hover {
            color: var(--primary-mr) !important;
            background-color: #ffffff !important;
        }
        .text-primary {
            color: var(--primary-mr) !important;
        }
        a:not(.btn) {
            color: var(--primary-mr);
        }
        a:not(.btn):hover {
            color: var(--primary-hover-mr);
        }
        .btn-primary {
            background-color: var(--primary-mr) !important;
            border-color: var(--primary-mr) !important;
            color: #ffffff !important;
            font-weight: 600;
        }
        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--primary-hover-mr) !important;
            border-color: #0b4e69 !important;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-mr) !important;
            box-shadow: 0 0 0 0.25rem rgba(17, 119, 160, 0.25) !important;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">
    <header class="header-mr shadow-sm d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <i class="bi bi-buildings-fill fs-3"></i>
            <h3 class="m-0 fw-bold">CLUB TORTU</h3>
        </div>
        <div>
            <a href="Login.html" class="btn btn-outline-light btn-sm shadow-sm">
                <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
            </a>
        </div>
    </header>

    <main class="container d-flex justify-content-center align-items-center flex-grow-1 py-4">
        <div class="col-md-8 col-lg-7 col-xl-6">
            <div class="card registro-card shadow-sm p-4 p-md-5 bg-white rounded-3">
                <div class="text-center mb-4">
                    <i class="bi bi-person-plus-fill icono-registro"></i>
                    <h4 class="fw-bold text-primary mt-2">Registro de Asociado</h4>
                    <p class="text-muted small">Crea tu cuenta para acceder a los beneficios y actividades del club</p>
                </div>

                <form id="formRegistro" action="../modelo/guardarAsociado.php" method="post" novalidate>
                    <div class="row g-3">
                        <div class="col-12">
                            <label for="documento" class="form-label fw-semibold">Documento de Identidad <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-card-text text-muted"></i></span>
                                <input type="text" class="form-control" id="documento" name="documento" inputmode="numeric" pattern="[0-9]+" required placeholder="Ej: 1057000111">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="nombres" class="form-label fw-semibold">Nombres <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-fill text-muted"></i></span>
                                <input type="text" class="form-control" id="nombres" name="nombres" required placeholder="Nombres completos">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="apellidos" class="form-label fw-semibold">Apellidos <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control" id="apellidos" name="apellidos" required placeholder="Apellidos completos">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="fechaNacimiento" class="form-label fw-semibold">Fecha de Nacimiento <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-calendar-event text-muted"></i></span>
                                <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-semibold d-block">Género <span class="text-danger">*</span></label>
                            <div class="d-flex gap-3 pt-2">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="genero" id="generoM" value="Masculino" required checked>
                                    <label class="form-check-label" for="generoM">Masculino</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="genero" id="generoF" value="Femenino">
                                    <label class="form-check-label" for="generoF">Femenino</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="genero" id="generoO" value="Otro">
                                    <label class="form-check-label" for="generoO">Otro</label>
                                </div>
                            </div>
                        </div>

                        <div class="col-md-8">
                            <label for="direccionResidencia" class="form-label fw-semibold">Dirección de Residencia <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-geo-alt-fill text-muted"></i></span>
                                <input type="text" class="form-control" id="direccionResidencia" name="direccionResidencia" required placeholder="Ej: Calle 15 # 10-20">
                            </div>
                        </div>

                        <div class="col-md-4">
                            <label for="ciudad" class="form-label fw-semibold">Ciudad <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-buildings text-muted"></i></span>
                                <select class="form-select" id="ciudad" name="ciudad" required>
                                    <option value="" disabled selected>Ciudad</option>
                                    <option value="Sogamoso">Sogamoso</option>
                                    <option value="Duitama">Duitama</option>
                                    <option value="Tunja">Tunja</option>
                                    <option value="Paipa">Paipa</option>
                                    <option value="Nobsa">Nobsa</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="telefono" class="form-label fw-semibold">Teléfono Celular <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-telephone-fill text-muted"></i></span>
                                <input type="tel" class="form-control" id="telefono" name="telefono" required placeholder="Ej: 3101234567">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Correo Electrónico <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope-fill text-muted"></i></span>
                                <input type="email" class="form-control" id="email" name="email" required placeholder="correo@ejemplo.com">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">Contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-muted"></i></span>
                                <input type="password" class="form-control" id="password" name="password" required minlength="8" placeholder="Mínimo 8 caracteres">
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="confirmarPassword" class="form-label fw-semibold">Confirmar Contraseña <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock-check-fill text-muted"></i></span>
                                <input type="password" class="form-control" id="confirmarPassword" name="confirmarPassword" required minlength="8" placeholder="Repita la contraseña">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4 pt-3 border-top">
                        <button type="reset" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-eraser me-1"></i> Limpiar
                        </button>
                        <button type="submit" class="btn btn-primary px-4 shadow-sm">
                            <i class="bi bi-person-check-fill me-1"></i> Registrarse
                        </button>
                    </div>

                    <div id="mensajeRegistro" class="text-center mt-3 fw-semibold small" role="status"></div>

                    <div class="text-center mt-3 pt-3 border-top">
                        <a href="Login.html" class="text-decoration-none small">
                            ¿Ya tienes cuenta? <strong>Inicia Sesión aquí</strong>
                        </a>
                        <br>
                        <a href="dashboard.html" class="text-muted text-decoration-none small mt-2 d-inline-block">
                            <i class="bi bi-arrow-left"></i> Volver al Panel
                        </a>
                    </div>
                </form>
            </div>

            <div class="text-center mt-3 text-muted small">
                &copy; 2026 Club Acerías - Todos los derechos reservados
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../controladores/asociado.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CLUB ADSO</title>
    <link rel="stylesheet" href="../ACCES/css/Style.css">
</head>
<body>
    <div class="contenedor contenedor-login">
        <h2>Iniciar sesión</h2>

        <form id="formLogin" action="" method="post">

            <div class="grupo-input">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" name="usuario" required placeholder="Ingrese su usuario">
            </div>

            <div class="grupo-input">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required placeholder="Ingrese su contraseña">
            </div>

            <div class="grupo-botones">
                <button type="submit" class="btn-guardar">Ingresar</button>
                <button type="reset" class="btn-limpiar">Limpiar</button>
            </div>

        </form>
    </div>
</body>
</html>
